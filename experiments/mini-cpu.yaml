# Expérience réelle locale (story 4.14) : profil `cpu` (Ollama sans couche GPU, embedder
# multilingual-e5-small sur CPU). Depuis la v0.3.0 (story 9.5), le seul appel d'API est celui du
# Juge `claude-opus-5-5` (plafond Anthropic de 3,00 USD). Le profil `cpu` met
# `claude-haiku-5-5` en tête de `generator_models` : chaque modèle est donc nommé ici.
# Prérequis : `uv sync --extra local` et `wl installer --profil cpu`.
# Story 8.7 (option c, décision d'Anaël) : la sélection PageIndex utilise granite4.2:3b, car
# minicpm5:1b dégénère jusqu'à select_max_tokens et un repeat_penalty au profil dégradait le
# Generator de PageIndex. select_model n'est pas un answer_producer (AD-14) : le Panel ne change pas.
experiment_id: mini-cpu
seed: 42
profile: cpu
corpus: ../corpora/minicorpus/corpus.yaml
questions: ../corpora/minicorpus/questions.yaml
split: dev
# Story 8.8 : sans max_questions, tout le split dev (18 Questions depuis le Gel du 2026-10-26 ; 19 à la 8.8).
conditions: [standard]
judges:
  # Story 9.5 : Juge unique calibré (AD-14 amendé, décision d'Anaël du 2026-10-26) ; Famille claude,
  # distincte du Generator minicpm. Calibration de la story 9.9 : kappas 1,00 / 0,72 / 0,76.
  pool: [claude-opus-5-5]
  panel_size: 1
  excluded_from: ../corpora/minicorpus/calibration/opus.json
budget:
  per_run: {anthropic: {amount: "3.00", currency: USD}}
configurations:
  - id: bm25
    architecture: bm25_only
    params:
      generator: {name: llm, params: {model: "minicpm5:1b-q4_k_m"}}
  - id: rag-naif
    architecture: naive_rag
    params:
      generator: {name: llm, params: {model: "minicpm5:1b-q4_k_m"}}
  - id: raptor
    architecture: raptor
    params:
      summary_model: "minicpm5:1b-q4_k_m"
      generator: {name: llm, params: {model: "minicpm5:1b-q4_k_m"}}
  - id: pageindex
    architecture: pageindex
    params:
      summary_model: "minicpm5:1b-q4_k_m"
      select_model: "granite4.2:3b"
      generator: {name: llm, params: {model: "minicpm5:1b-q4_k_m"}}
