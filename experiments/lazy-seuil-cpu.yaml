# Story 8.8 (arbitrage P8) : balayage de `relevance_threshold` de LazyGraphRAG sur le split dev,
# profil `cpu`, mêmes modèles que `mini-cpu.yaml`. Les trois Configurations ne diffèrent que par
# un paramètre de requête : l'index est construit une fois. La valeur par défaut (0,1) ne change
# que sur décision d'Anaël. Depuis la v0.3.0 : Juge unique `claude-opus-5-5` (plafond de 2,00 USD).
# Prérequis : `uv sync --extra local` et `wl installer --profil cpu`.
experiment_id: lazy-seuil-cpu
seed: 42
profile: cpu
corpus: ../corpora/minicorpus/corpus.yaml
questions: ../corpora/minicorpus/questions.yaml
split: dev
conditions: [standard]
judges:
  # Story 9.5 : Juge unique calibré (AD-14 amendé, décision d'Anaël du 2026-10-26) ; Famille claude,
  # distincte du Generator minicpm. Calibration de la story 9.9 : kappas 1,00 / 0,72 / 0,76.
  pool: [claude-opus-5-5]
  panel_size: 1
  excluded_from: ../corpora/minicorpus/calibration/opus.json
llm_cache: {isoler_configurations: true}  # chaque seuil fait son propre appel et sa latence
budget:
  per_run: {anthropic: {amount: "2.00", currency: USD}}
configurations:
  - id: lazy-seuil-01
    architecture: lazy_graphrag
    params: &lazy
      generator: {name: llm, params: {model: "minicpm5:1b-q4_k_m"}}
      decider: {name: llm, params: {model: "granite4.2:3b"}}
      relevance_threshold: 0.1
  - id: lazy-seuil-03
    architecture: lazy_graphrag
    params: {<<: *lazy, relevance_threshold: 0.3}
  - id: lazy-seuil-05
    architecture: lazy_graphrag
    params: {<<: *lazy, relevance_threshold: 0.5}
