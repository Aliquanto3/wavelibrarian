# Catalogue de modèles (contracts.md §4.2). Un modèle d'API sans `pricing` est refusé.
catalog_date: 2026-10-17
models:
  - id: claude-haiku-5-5
    provider: anthropic
    family: claude
    kind: api
    modality: llm
    context_window: 1000000            # page Modèles Anthropic, relevée le 2026-10-17
    max_output_tokens: 128000
    tokenizer: reference
    token_factor: "1.5"                # le tokenizer de Haiku 5.5 compte environ 30 % de tokens de plus que Haiku 4.5
    prompt_cache: true
    min_cacheable_tokens: 512          # un préfixe plus court n'est pas mis en cache, sans erreur
    pricing:
      date: 2026-10-17                 # platform.claude.com/docs/en/about-claude/pricing
      currency: USD
      per_mtok: {input: "0.10", output: "0.50", cache_read: "0.01",
                 cache_write: "0.125", cache_write_1h: "0.20"}
      batch_per_mtok: {input: "0.05", output: "0.25"}
      tiers: [{above_prompt_tokens: 100000, multiplier: "5"}]
      # Le palier s'applique à toute la requête (tous les postes, cache compris) dès que
      # le prompt (entrée + lecture + écriture de cache) dépasse 100 000 tokens.
  - {id: "minicpm5:1b-q4_k_m", provider: ollama, family: minicpm, kind: local, modality: llm,
     context_window: 32768, max_output_tokens: 2048, tokenizer: reference, prompt_cache: false}
  - {id: "minicpm5:2b-q4_k_m", provider: ollama, family: minicpm, kind: local, modality: llm,
     context_window: 32768, max_output_tokens: 2048, tokenizer: reference, prompt_cache: false}
  - {id: "granite4.2:3b", provider: ollama, family: granite, kind: local, modality: llm,
     context_window: 32768, max_output_tokens: 2048, tokenizer: reference, prompt_cache: false}
  - {id: "qwen3.5:4b", provider: ollama, family: qwen, kind: local, modality: llm,
     context_window: 32768, max_output_tokens: 2048, tokenizer: reference, prompt_cache: false}
  - {id: "ministral-3:8b", provider: ollama, family: mistral, kind: local, modality: llm,
     context_window: 32768, max_output_tokens: 2048, tokenizer: reference, prompt_cache: false}
  - {id: multilingual-e5-small, provider: sentence_transformers, hf_repo: intfloat/multilingual-e5-small,
     family: e5, kind: local, modality: embedding, dim: 384, query_prefix: "query: ", passage_prefix: "passage: "}
  - {id: bge-m3, provider: sentence_transformers, hf_repo: BAAI/bge-m3,
     family: bge, kind: local, modality: embedding, dim: 1024}
  # Modèles factices du profil `test` : prix fictif, aucun réseau.
  - &fake_llm
    id: fake-llm-a
    provider: fake
    family: fake-a
    kind: api
    modality: llm
    context_window: 100000
    max_output_tokens: 2048
    tokenizer: approx
    prompt_cache: true
    pricing:
      date: 2026-10-17
      currency: USD
      per_mtok: {input: "1.00", output: "2.00", cache_read: "0.10", cache_write: "1.25"}
  - <<: *fake_llm
    id: fake-llm-b
    family: fake-b
  - <<: *fake_llm
    id: fake-llm-c
    family: fake-c
  - {id: fake-embedder, provider: fake, family: fake-embedder, kind: local, modality: embedding,
     dim: 64, tokenizer: approx}
