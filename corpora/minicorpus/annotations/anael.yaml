    Notes on the Vaelmor Tide Almanac Working notes by the cartographer Maëlis Torvane on how to read
    the tide almanac of the archipelago. The forty-two day cycle The Pale Gorge current reverses every
    forty-two days. Pilots of the Grey Tides Company use the almanac to know in advance which direction
    the current will run. A reversal in the middle of a crossing can add a full day to the journey between
    Keld and Sarnoux. Reading the almanac Each page covers one week. The left column gives the height
    of the high tide at the Old Mole in Port-Ysel, and the right column gives the direction of the current.
    A small lantern symbol marks the days when the lighthouse of Keld shows its flashing light. Known
    errors The edition of the year 1409 contains a mistake: it places the great tide of the autumn three
    days too early. Harbour master Oswin Dacrel ordered the printing house to correct the later editions.'
  - '[S3] (4f70a5c462fa4b04#h/le-phare-de-keld, 4f70a5c462fa4b04#h/le-phare-de-keld/le-gardien, 4f70a5c462fa4b04#h/le-phare-de-keld/les-signaux,
    4f70a5c462fa4b04#h/le-phare-de-keld/entretien) Le phare de Keld Le phare de Keld se dresse à la pointe
    nord de l''île du même nom. Construit en l''an 1297, il mesure trente-quatre mètres. Sa lanterne a
    brûlé de l''huile de phoque jusqu''en l''an 1380, puis de l''huile de colza. Le gardien Le gardien
    actuel est Bram Oskelle, en poste depuis l''an 1398. Il vit au pied du phare avec sa famille et un
    troupeau de vingt-sept moutons. Il allume la lanterne au coucher du soleil et la maintient jusqu''à
    l''aube. Les signaux Un feu fixe signale la passe de l''Ouest ouverte. Un feu à éclats annonce la
    Haute Eau et la fermeture de la passe aux navires de plus de quarante tonneaux. En cas de brouillard,
    une cloche sonne toutes les deux minutes, ce qui est essentiel pour les pêcheurs de Brumeval. Entretien
    Le Conseil des Quais finance l''entretien du phare à hauteur de trois cents deniers par an. En l''an
    1412, la lanterne a été remplacée par un modèle plus lumineux fabriqué par les verriers de Port-Ysel.'
