  reference_passages:
  - |-
    Séances

    Le Conseil se réunit le quinze de chaque mois dans la Halle des Cordages. Toutes les séances sont publiques, y compris celles qui concernent la quarantaine.
  context_passages:
  - '[S1] (a478953867401217#h/charte-du-conseil-des-quais, a478953867401217#h/charte-du-conseil-des-quais/composition,
    a478953867401217#h/charte-du-conseil-des-quais/mandat, a478953867401217#h/charte-du-conseil-des-quais/quorum-et-decisions,
    a478953867401217#h/charte-du-conseil-des-quais/seances) Charte du Conseil des Quais Version révisée
    de l''an 1413, qui remplace la charte de l''an 1290. Composition Le Conseil des Quais de Port-Ysel
    compte neuf sièges. Aux sept corporations d''origine s''ajoutent un siège pour les îles extérieures
    (Keld et Brumeval) et un siège pour Sarnoux. Mandat Les conseillers sont élus pour un mandat de six
    ans. Un conseiller peut être réélu deux fois. Le maître de port est élu directement par les conseillers
    pour trois ans et préside les séances. Quorum et décisions Le Conseil délibère valablement lorsque
    six conseillers sont présents. Les décisions importantes exigent la majorité des deux tiers. En cas
    d''égalité, le vote est reporté à la séance suivante. Séances Le Conseil se réunit le quinze de chaque
    mois dans la Halle des Cordages. Toutes les séances sont publiques, y compris celles qui concernent
    la quarantaine.'
  - '[S2] (2e662a86a652e22c#h/charte-du-conseil-des-quais, 2e662a86a652e22c#h/charte-du-conseil-des-quais/composition,
    2e662a86a652e22c#h/charte-du-conseil-des-quais/mandat, 2e662a86a652e22c#h/charte-du-conseil-des-quais/quorum-et-decisions,
    2e662a86a652e22c#h/charte-du-conseil-des-quais/seances) Charte du Conseil des Quais Version de l''an
    1290, applicable jusqu''à la révision de l''an 1413. Composition Le Conseil des Quais de Port-Ysel
    compte sept sièges. Chaque siège est attribué à un représentant d''une corporation : pêcheurs, passeurs,
    charpentiers de marine, sauniers, marchands, pilotes et gens de phare. Mandat Les conseillers sont
    élus pour un mandat de quatre ans. Un conseiller peut être réélu une seule fois. Le maître de port
    est choisi parmi les conseillers et préside les séances. Quorum et décisions Le Conseil délibère valablement
    lorsque cinq conseillers sont présents. Les décisions sont prises à la majorité simple. En cas d''égalité,
    la voix du maître de port compte double. Séances Le Conseil se réunit le premier jour de chaque mois
    dans la Halle des Cordages. Les séances sont publiques, sauf pour les questions de quarantaine.'
  - '[S3] (9c1249855783a0ca#h/la-compagnie-des-marees-grises/activites, 9c1249855783a0ca#h/la-compagnie-des-marees-grises/relations-avec-le-conseil)
    décrits dans son atlas. Relations avec le Conseil La Compagnie verse chaque année au Conseil des Quais
    une redevance de quatre cents deniers. En échange, le Conseil lui garantit l''usage exclusif du quai
    numéro trois du port de Port-Ysel. Oswin Dacrel a rappelé en l''an 1411 que ce privilège pouvait être
    révisé.'
  - '[S4] (df071d2eff588750#p3) ans à compter du premier jour de l''an 1413. Elle peut être révisée à
    la demande de l''une des parties, après un préavis de six mois. Toute révision exige l''accord des
    deux tiers du Conseil des Quais. Article 7 – Signatures Fait à Port-Ysel, dans la Halle des Cordages,
    le quinzième jour du mois de la Haute Eau. Signé : Oswin Dacrel, maître de port ; Tamsin Orrelle,
    directeur de la Compagnie des Marées Grises.'
  - '[S5] (750a0563faf1fe1f#p1) Grande régate de la Lanterne Le Conseil des Quais invite tous les équipages
    à la grande régate de la Lanterne, qui se tiendra le premier jour de l''an 1413 dans la rade de Port-Ysel.
    Programme - Départ à midi, depuis le Vieux Môle. - Parcours : tour de l''îlot de la Mouette, puis
    retour par la passe du Sud. - Remise des prix à la Halle des Cordages, au coucher du soleil. Règlement
    Les barques de moins de vingt tonneaux sont seules admises. Chaque équipage compte quatre marins au
    plus. La Brume Dorée, navire de la Compagnie des Marées Grises, ne concourt pas : elle servira de
    bateau du jury. Récompenses Le vainqueur reçoit une lanterne de cuivre et vingt deniers. Le maître
    de port Oswin Dacrel remettra les prix. Une soupe d''algues sera servie à tous les participants.'
