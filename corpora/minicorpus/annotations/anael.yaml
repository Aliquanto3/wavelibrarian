    le quinzième jour du mois de la Haute Eau. Signé : Oswin Dacrel, maître de port ; Tamsin Orrelle,
    directeur de la Compagnie des Marées Grises.'
  - '[S3] (31ee0b4995fad0d1#p1) Port-Ysel, le troisième jour de la Haute Eau, an 1412. Cher Hadrien, Je
    vous écris depuis le Vieux Môle, où j''attends le retour de la Grande Sève. Mon atlas est enfin terminé
    et Oswin Dacrel m''a promis de le faire imprimer avant la fin de l''hiver. J''ai ajouté en dernière
    page une table des renversements du courant de la Gorge Pâle, que je vous prie de vérifier lors de
    votre prochaine traversée. Vous avez raison au sujet du bois : le chêne de Sarnoux est plus dur que
    le pin de la Sève, et la coque y gagnera. Je soutiendrai votre demande devant le Conseil des Quais.
