    la cloche du phare sonne toutes les deux minutes, et celle du port de Brumeval guide les barques qui
    rentrent de la pêche. Au Vieux Môle, un feu rouge hissé au mât signale qu''un navire est retenu en
    quarantaine. Les distances Les marins de l''archipel comptent les distances en longueurs de câble,
    d''environ cent quatre-vingts pas chacune, et les traversées en jours de mer. Les durées ci-dessous
    valent par beau temps, hors Haute Eau, pour une goélette chargée. Traversée | Durée habituelle | Route
    Port-Ysel – Keld | Un jour | Passe de l''Ouest Port-Ysel – Brumeval | Deux jours | Passe de l''Ouest,
    puis cap à l''est Port-Ysel – Sarnoux | Un jour et demi | Passe du Sud pour les barques, passe de
    l''Ouest sinon Keld – Sarnoux | Quatre jours, deux avec la Gorge Pâle | Au large d''Ormesse Société
    Les corporations La vie de Port-Ysel s''organise autour de sept corporations : les pêcheurs, les passeurs,
    les charpentiers de marine, les sauniers, les marchands, les pilotes et les gens de'
  - '[S3] (a478953867401217#h/charte-du-conseil-des-quais, a478953867401217#h/charte-du-conseil-des-quais/composition,
    a478953867401217#h/charte-du-conseil-des-quais/mandat, a478953867401217#h/charte-du-conseil-des-quais/quorum-et-decisions,
    a478953867401217#h/charte-du-conseil-des-quais/seances) Charte du Conseil des Quais Version révisée
    de l''an 1413, qui remplace la charte de l''an 1290. Composition Le Conseil des Quais de Port-Ysel
    compte neuf sièges. Aux sept corporations d''origine s''ajoutent un siège pour les îles extérieures
    (Keld et Brumeval) et un siège pour Sarnoux. Mandat Les conseillers sont élus pour un mandat de six
    ans. Un conseiller peut être réélu deux fois. Le maître de port est élu directement par les conseillers
    pour trois ans et préside les séances. Quorum et décisions Le Conseil délibère valablement lorsque
    six conseillers sont présents. Les décisions importantes exigent la majorité des deux tiers. En cas
    d''égalité, le vote est reporté à la séance suivante. Séances Le Conseil se réunit le quinze de chaque
    mois dans la Halle des Cordages. Toutes les séances sont publiques, y compris celles qui concernent
    la quarantaine.'
