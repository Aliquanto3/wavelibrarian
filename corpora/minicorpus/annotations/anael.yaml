  - |-
    Composition

    Le Conseil des Quais de Port-Ysel compte sept sièges. Chaque siège est attribué à un représentant d'une corporation : pêcheurs, passeurs, charpentiers de marine, sauniers, marchands, pilotes et gens de phare.
  - |-
    Composition

    Le Conseil des Quais de Port-Ysel compte neuf sièges. Aux sept corporations d'origine s'ajoutent un siège pour les îles extérieures (Keld et Brumeval) et un siège pour Sarnoux.
  context_passages:
  - '[S1] (a478953867401217#h/charte-du-conseil-des-quais, a478953867401217#h/charte-du-conseil-des-quais/composition,
