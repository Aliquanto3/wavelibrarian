    Tarifs des passeurs de l'Archipel
    Tarifs en vigueur pour la saison de l'an 1412, fixés par la corporation des passeurs de
    Port-Ysel.
    Traversées de passagers
    Port-Ysel – Keld : quatre deniers. Port-Ysel – Brumeval : six deniers. Port-Ysel –
    Sarnoux : cinq deniers. Un enfant de moins de dix ans voyage pour la moitié du prix.
    Bagages et bêtes
    Un bagage de plus de vingt livres coûte un denier de plus. Un mouton de Keld paie
    deux deniers, un cheval huit deniers. Les paniers de sel de Sarnoux sont transportés
    au tarif de la Compagnie des Marées Grises.
