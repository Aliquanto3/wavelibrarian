    add51e9f5b0e469e#h/procedure-de-quarantaine-du-port-de-port-ysel/confidentialite) Procédure de quarantaine
    du port de Port-Ysel Procédure interne du Conseil des Quais, applicable à tout navire arrivant d''une
    île touchée par la fièvre grise. Déclenchement Le maître de port Oswin Dacrel déclare la quarantaine
    après avis du médecin du port, Isaure Pellan. Le feu rouge est alors hissé au Vieux Môle. Durée Tout
    navire suspect reste au mouillage pendant onze jours. L''équipage ne descend pas à terre. Les vivres
    sont livrés par le bateau-pilote Veilleuse, qui reste à distance de deux longueurs de câble. Levée
    La quarantaine est levée si aucun cas n''est déclaré pendant onze jours. Le Conseil des Quais en est
    informé par écrit. Un navire de la Compagnie des Marées Grises ne peut pas être exempté de cette règle.
    Confidentialité Les noms des malades ne figurent jamais dans les registres publics. Seul le médecin
    du port conserve la liste, qu''il détruit à la fin de la saison.'
  - '[S5] (1140331c18193a5d#h/atlas-de-l-archipel-de-vaelmor/navigation/les-feux-et-les-signaux, 1140331c18193a5d#h/atlas-de-l-archipel-de-vaelmor/navigation/les-distances,
