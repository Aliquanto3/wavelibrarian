    Les légendes des brumes Recueil de trois légendes de Brumeval, racontées par les anciens et notées
    au fil des saisons. La dame de la cloche On raconte qu''une femme, Elwenn Marsac, sonne la cloche
    du port les nuits de brouillard pour guider les barques perdues. Les pêcheurs affirment qu''elle ne
    vieillit pas et que sa cloche ne sonne jamais deux fois de la même manière. Le hareng d''argent Un
    hareng plus grand qu''une barque vivrait dans la fosse située au large de Brumeval. Quiconque le voit
    doit rejeter à l''eau sa première prise de la saison. Les marins de la Compagnie des Marées Grises
    ne croient pas à cette histoire, mais ils respectent l''usage. Les lanternes de Sarnoux Certains soirs,
    de petites lumières dansent sur les marais salants de Sarnoux. Les sauniers disent qu''il s''agit
    des âmes des marins morts pendant les guerres du sel. Maëlis Torvane a consigné cette légende dans
    ses carnets sans y ajouter de commentaire.'
  - '[S5] (1140331c18193a5d#h/atlas-de-l-archipel-de-vaelmor/societe/les-corporations, 1140331c18193a5d#h/atlas-de-l-archipel-de-vaelmor/societe/la-monnaie-et-les-mesures,
    1140331c18193a5d#h/atlas-de-l-archipel-de-vaelmor/societe/le-calendrier) corporations La vie de Port-Ysel
    s''organise autour de sept corporations : les pêcheurs, les passeurs, les charpentiers de marine,
    les sauniers, les marchands, les pilotes et les gens de phare. Chacune élit un représentant au Conseil
    des Quais. Les corporations fixent leurs propres tarifs ; celle des passeurs publie chaque saison
