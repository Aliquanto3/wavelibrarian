    e5dff5325d93c812#h/visitor-s-guide-to-port-ysel/practical-advice) Visitor''s Guide to Port-Ysel Port-Ysel
    is the only large town of the fictional Archipelago of Vaelmor. This short guide was written for travellers
    arriving in the year 1412 of the Lantern Era. Arriving Ships dock at the Old Mole, the first quay
    of the town, built in the year 1203. During the High Water season, the Western Pass is closed to ships
    of more than forty tons, so large vessels must go around the island of Keld. The harbour master, Oswin
    Dacrel, can be found in the Hall of Ropes every morning. What to see The Lighthouse of Keld can be
    visited by boat on clear days. The keeper, Bram Oskelle, welcomes guests and offers tea. In town,
    do not miss the shipyard of Ormesse, where the coaster Misty Gold was launched this year for the Grey
    Tides Company. What to eat Try the seaweed soup of Brumeval, served with black bread and smoked silver
    herring. Visitors should avoid the salt cakes of Sarnoux, which are very strong. Practical advice
    The council meets on the first day of each month in the Hall of Ropes, and most of its sessions are
    open to the public. Money is counted in deniers. A night in an inn costs about six deniers. If a ship
    arrives from'
  - '[S2] (0f1c6e54c5f3c5f4#h/notes-on-the-vaelmor-tide-almanac, 0f1c6e54c5f3c5f4#h/notes-on-the-vaelmor-tide-almanac/the-forty-two-day-cycle,
