    1140331c18193a5d#h/atlas-de-l-archipel-de-vaelmor/navigation/les-passes) Compagnie des Marées Grises
    | Port-Ysel Le Conseil des Quais Le Conseil des Quais gouverne Port-Ysel et arbitre les différends
    entre les îles. Sa charte, qui date de l''an 1290, fixe le nombre de sièges et la durée des mandats
    ; une révision est en préparation. Oswin Dacrel en est le maître de port depuis l''an 1405. Économie
    Le hareng argenté Les pêcheurs de Brumeval rapportent chaque année environ deux cents tonnes de hareng
    argenté. Le poisson est fumé à Brumeval, puis expédié à Port-Ysel dans des caisses de bois de pin.
    La Compagnie des Marées Grises détient le monopole du transport depuis l''an 1388. Le sel de Sarnoux
    Les salines de Sarnoux produisent un sel gris très recherché. Le traité de Brumeval en limite la production
    à six cents mesures par saison. Les vanniers de l''île fabriquent les paniers qui servent à le transporter.
