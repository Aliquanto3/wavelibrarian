    e5dff5325d93c812#h/visitor-s-guide-to-port-ysel/practical-advice) Visitor''s Guide to Port-Ysel Port-Ysel
    is the only large town of the fictional Archipelago of Vaelmor. This short guide was written for travellers
    arriving in the year 1412 of the Lantern Era. Arriving Ships dock at the Old Mole, the first quay
    of the town, built in the year 1203. During the High Water season, the Western Pass is closed to ships
    of more than forty tons, so large vessels must go around the island of Keld. The harbour master, Oswin
    Dacrel, can be found in the Hall of Ropes every morning. What to see The Lighthouse of Keld can be
    visited by boat on clear days. The keeper, Bram Oskelle, welcomes guests and offers tea. In town,
    do not miss the shipyard of Ormesse, where the coaster Misty Gold was launched this year for the Grey
    Tides Company. What to eat Try the seaweed soup of Brumeval, served with black bread and smoked silver
    herring. Visitors should avoid the salt cakes of Sarnoux, which are very strong. Practical advice
    The council meets on the first day of each month in the Hall of Ropes, and most of its sessions are
    open to the public. Money is counted in deniers. A night in an inn costs about six deniers. If a ship
    arrives from'
  - '[S2] (e5dff5325d93c812#h/visitor-s-guide-to-port-ysel/practical-advice) the first day of each month
    in the Hall of Ropes, and most of its sessions are open to the public. Money is counted in deniers.
    A night in an inn costs about six deniers. If a ship arrives from an island hit by the grey fever,
    passengers must wait eleven days at anchor before landing.'
  - '[S3] (0f1c6e54c5f3c5f4#h/notes-on-the-vaelmor-tide-almanac, 0f1c6e54c5f3c5f4#h/notes-on-the-vaelmor-tide-almanac/the-forty-two-day-cycle,
    0f1c6e54c5f3c5f4#h/notes-on-the-vaelmor-tide-almanac/reading-the-almanac, 0f1c6e54c5f3c5f4#h/notes-on-the-vaelmor-tide-almanac/known-errors)
    Notes on the Vaelmor Tide Almanac Working notes by the cartographer Maëlis Torvane on how to read
    the tide almanac of the archipelago. The forty-two day cycle The Pale Gorge current reverses every
    forty-two days. Pilots of the Grey Tides Company use the almanac to know in advance which direction
    the current will run. A reversal in the middle of a crossing can add a full day to the journey between
    Keld and Sarnoux. Reading the almanac Each page covers one week. The left column gives the height
    of the high tide at the Old Mole in Port-Ysel, and the right column gives the direction of the current.
    A small lantern symbol marks the days when the lighthouse of Keld shows its flashing light. Known
    errors The edition of the year 1409 contains a mistake: it places the great tide of the autumn three
    days too early. Harbour master Oswin Dacrel ordered the printing house to correct the later editions.'
  - '[S4] (add51e9f5b0e469e#h/procedure-de-quarantaine-du-port-de-port-ysel, add51e9f5b0e469e#h/procedure-de-quarantaine-du-port-de-port-ysel/declenchement,
