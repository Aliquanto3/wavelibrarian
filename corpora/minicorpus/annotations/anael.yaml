  question: Quelles contraintes la saison de la Haute Eau impose-t-elle à la navigation et aux traversées
    ?
  reference_answer: La passe de l'Ouest est fermée aux navires de plus de quarante tonneaux, les tarifs
    des passeurs sont majorés d'un tiers et les passeurs ne sortent pas quand le feu à éclats est allumé.
  answer: Le temps de brouillard, la cloche du phare et la cloche du port sont des contraintes spécifiques
    à la navigation pendant la Haute Eau.
