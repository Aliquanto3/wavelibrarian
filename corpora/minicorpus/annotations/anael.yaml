    permettra aux pilotes de planifier les traversées. Je transmettrai ma table au Conseil des Quais.
    Dernier jour Retour à Port-Ysel. Oswin Dacrel m''a reçue au Vieux Môle et a promis de faire imprimer
    l''atlas. Je n''ai pas osé lui avouer que j''ai perdu mon compas de laiton dans la baie de Sarnoux.'
