    grandes marées, et l''on désigne les autres par leur rang. La santé Le médecin du port veille sur
    la santé des équipages. La fièvre grise, qui touche parfois les îles extérieures, oblige les navires
    suspects à rester onze jours au mouillage avant de débarquer. Le bateau-pilote Veilleuse leur livre
    les vivres à distance. Voir aussi Le registre des navires, le journal de Maëlis Torvane et l''histoire
    de la Compagnie des Marées Grises complètent cet atlas.'
  - '[S2] (840ccabb06434f5e#h/glossaire-maritime-de-vaelmor, 840ccabb06434f5e#h/glossaire-maritime-de-vaelmor/termes-de-navigation,
    840ccabb06434f5e#h/glossaire-maritime-de-vaelmor/termes-de-commerce, 840ccabb06434f5e#h/glossaire-maritime-de-vaelmor/termes-de-la-vie-a-bord)
    Glossaire maritime de Vaelmor Termes employés par les marins de l''archipel. Termes de navigation
    Haute Eau : saison des grandes marées, de la mi-automne au début de l''hiver. Gorge Pâle : courant
    qui traverse l''archipel du nord-ouest vers le sud-est. Passe de l''Ouest : chenal étroit entre Ormesse
    et Keld, fermé aux grands navires pendant la Haute Eau. Longueur de câble : unité de distance valant
    environ cent quatre-vingts pas. Termes de commerce Denier : monnaie de compte du Conseil des Quais.
    Mesure : unité de volume du sel, fixée par le traité de Brumeval. Quai numéro trois : quai réservé
    à la Compagnie des Marées Grises. Termes de la vie à bord Ère de la Lanterne : calendrier de l''archipel,
    dont l''an 1 correspond à la première lanterne allumée à Port-Ysel. Fête de la Lanterne : premier
    jour de l''an, célébré par une soupe d''algues.'
  - '[S3] (750a0563faf1fe1f#p1) Grande régate de la Lanterne Le Conseil des Quais invite tous les équipages
    à la grande régate de la Lanterne, qui se tiendra le premier jour de l''an 1413 dans la rade de Port-Ysel.
    Programme - Départ à midi, depuis le Vieux Môle. - Parcours : tour de l''îlot de la Mouette, puis
    retour par la passe du Sud. - Remise des prix à la Halle des Cordages, au coucher du soleil. Règlement
    Les barques de moins de vingt tonneaux sont seules admises. Chaque équipage compte quatre marins au
    plus. La Brume Dorée, navire de la Compagnie des Marées Grises, ne concourt pas : elle servira de
    bateau du jury. Récompenses Le vainqueur reçoit une lanterne de cuivre et vingt deniers. Le maître
    de port Oswin Dacrel remettra les prix. Une soupe d''algues sera servie à tous les participants.'
  - '[S4] (0d5e0a0ad541270b#h/les-legendes-des-brumes, 0d5e0a0ad541270b#h/les-legendes-des-brumes/la-dame-de-la-cloche,
