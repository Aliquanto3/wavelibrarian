  context_passages:
  - '[S1] (0f1c6e54c5f3c5f4#h/notes-on-the-vaelmor-tide-almanac, 0f1c6e54c5f3c5f4#h/notes-on-the-vaelmor-tide-almanac/the-forty-two-day-cycle,
    0f1c6e54c5f3c5f4#h/notes-on-the-vaelmor-tide-almanac/reading-the-almanac, 0f1c6e54c5f3c5f4#h/notes-on-the-vaelmor-tide-almanac/known-errors)
    Notes on the Vaelmor Tide Almanac Working notes by the cartographer Maëlis Torvane on how to read
    the tide almanac of the archipelago. The forty-two day cycle The Pale Gorge current reverses every
    forty-two days. Pilots of the Grey Tides Company use the almanac to know in advance which direction
    the current will run. A reversal in the middle of a crossing can add a full day to the journey between
    Keld and Sarnoux. Reading the almanac Each page covers one week. The left column gives the height
    of the high tide at the Old Mole in Port-Ysel, and the right column gives the direction of the current.
    A small lantern symbol marks the days when the lighthouse of Keld shows its flashing light. Known
    errors The edition of the year 1409 contains a mistake: it places the great tide of the autumn three
    days too early. Harbour master Oswin Dacrel ordered the printing house to correct the later editions.'
  - '[S2] (1140331c18193a5d#h/atlas-de-l-archipel-de-vaelmor/societe/le-calendrier, 1140331c18193a5d#h/atlas-de-l-archipel-de-vaelmor/societe/la-sante,
    1140331c18193a5d#h/atlas-de-l-archipel-de-vaelmor/voir-aussi) 1 correspond à la première lanterne
    allumée à Port-Ysel. L''année commence par la fête de la Lanterne, où l''on sert une soupe d''algues.
    Les mois n''ont pas de nom : on dit le mois de la Haute Eau pour le premier mois de la saison des
    grandes marées, et l''on désigne les autres par leur rang. La santé Le médecin du port veille sur
    la santé des équipages. La fièvre grise, qui touche parfois les îles extérieures, oblige les navires
    suspects à rester onze jours au mouillage avant de débarquer. Le bateau-pilote Veilleuse leur livre
    les vivres à distance. Voir aussi Le registre des navires, le journal de Maëlis Torvane et l''histoire
    de la Compagnie des Marées Grises complètent cet atlas.'
  - '[S3] (6deef3c9ac9a1007#h/bulletin-des-marees-de-port-ysel, 6deef3c9ac9a1007#h/bulletin-des-marees-de-port-ysel/hauteurs,
