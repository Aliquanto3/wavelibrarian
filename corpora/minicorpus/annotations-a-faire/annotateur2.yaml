      2e662a86a652e22c#h/charte-du-conseil-des-quais/seances
    text: 'Charte du Conseil des Quais Version de l''an 1290, applicable jusqu''à la révision de l''an
      1413. Composition Le Conseil des Quais de Port-Ysel compte sept sièges. Chaque siège est attribué
      à un représentant d''une corporation : pêcheurs, passeurs, charpentiers de marine, sauniers, marchands,
      pilotes et gens de phare. Mandat Les conseillers sont élus pour un mandat de quatre ans. Un conseiller
      peut être réélu une seule fois. Le maître de port est choisi parmi les conseillers et préside les
      séances. Quorum et décisions Le Conseil délibère valablement lorsque cinq conseillers sont présents.
      Les décisions sont prises à la majorité simple. En cas d''égalité, la voix du maître de port compte
      double. Séances Le Conseil se réunit le premier jour de chaque mois dans la Halle des Cordages.
      Les séances sont publiques, sauf pour les questions de quarantaine.'
