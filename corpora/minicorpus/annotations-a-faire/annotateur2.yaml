  0a06af84:
    anchor: 4f70a5c462fa4b04#h/le-phare-de-keld, 4f70a5c462fa4b04#h/le-phare-de-keld/le-gardien, 4f70a5c462fa4b04#h/le-phare-de-keld/les-signaux,
      4f70a5c462fa4b04#h/le-phare-de-keld/entretien
    text: Le phare de Keld Le phare de Keld se dresse à la pointe nord de l'île du même nom. Construit
      en l'an 1297, il mesure trente-quatre mètres. Sa lanterne a brûlé de l'huile de phoque jusqu'en
      l'an 1380, puis de l'huile de colza. Le gardien Le gardien actuel est Bram Oskelle, en poste depuis
      l'an 1398. Il vit au pied du phare avec sa famille et un troupeau de vingt-sept moutons. Il allume
      la lanterne au coucher du soleil et la maintient jusqu'à l'aube. Les signaux Un feu fixe signale
      la passe de l'Ouest ouverte. Un feu à éclats annonce la Haute Eau et la fermeture de la passe aux
      navires de plus de quarante tonneaux. En cas de brouillard, une cloche sonne toutes les deux minutes,
      ce qui est essentiel pour les pêcheurs de Brumeval. Entretien Le Conseil des Quais finance l'entretien
      du phare à hauteur de trois cents deniers par an. En l'an 1412, la lanterne a été remplacée par
      un modèle plus lumineux fabriqué par les verriers de Port-Ysel.
  fc16c2a9:
    text: |-
      Le phare de Keld

      Le phare de Keld se dresse à la pointe nord de l'île du même nom. Construit en l'an 1297, il mesure trente-quatre mètres. Sa lanterne a brûlé de l'huile de phoque jusqu'en l'an 1380, puis de l'huile de colza.
