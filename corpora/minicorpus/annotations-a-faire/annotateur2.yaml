  c485e444:
    anchor: 9c1249855783a0ca#h/la-compagnie-des-marees-grises
    text: |-
      La Compagnie des Marées Grises

      La Compagnie des Marées Grises a été créée à Port-Ysel en l'an 1388 par douze armateurs qui voulaient mettre fin aux pillages dans la passe de l'Ouest. Elle détient depuis cette date le monopole du transport du hareng argenté entre Brumeval et Ormesse.
  37e46e15:
    anchor: df071d2eff588750#p1
    text: |-
      Convention de douane de Port-Ysel
      Convention conclue en l'an 1412 entre le Conseil des Quais et la Compagnie des
      Marées Grises, relative aux droits perçus sur les marchandises débarquées à
      Port-Ysel.
      Article premier – Objet
      La présente convention fixe les droits de douane sur les marchandises qui entrent
      dans le port de Port-Ysel. Elle s'applique à tous les navires inscrits au registre, qu'ils
      appartiennent ou non à la Compagnie des Marées Grises. Le maître de port Oswin
      Dacrel veille à son application.
      Article 2 – Droits sur le hareng et le sel
      Le hareng argenté fumé paie un droit de deux deniers par caisse. Le sel de Sarnoux
      paie un droit d'un denier par mesure, conformément au traité de Brumeval. Les œufs
      de hareng, considérés comme une denrée de luxe, paient un droit de cinq deniers par
      pot.
  4dcddeea:
    anchor: df071d2eff588750#p2
    text: |-
      Article 3 – Exemptions
      Sont exemptés de droits : le courrier du Conseil des Quais, les vivres destinés au
      phare de Keld et les secours envoyés aux îles touchées par la fièvre grise. Les
      marchandises de la Grande Sève ne bénéficient d'aucune autre exemption que celles
      de cet article.
      Article 4 – Contrôle
      Les caisses sont contrôlées au quai numéro trois par deux agents du Conseil. En cas
      de désaccord sur le contenu d'une caisse, le directeur de la Compagnie, Tamsin
      Orrelle, peut demander un second contrôle. Le coût de ce second contrôle est de trois
      deniers, à la charge du demandeur.
      Article 5 – Amendes
      Toute fausse déclaration est punie d'une amende égale au triple du droit éludé. Une
      seconde infraction dans la même saison entraîne la suspension du navire pendant
      vingt jours. Cette règle est qualifiée de « sévère mais juste » par les armateurs.
  4e420136:
    anchor: 985e6703a945e9e6#h/note-sur-le-quai-numero-quatre
    text: |-
      Note sur le quai numéro quatre

      Note de service de l'an 1398, devenue obsolète.

      Le quai numéro quatre du port de Port-Ysel est réservé à la barque Écume Bleue. Le Conseil des Quais en décidera l'affectation définitive à la prochaine séance. Cette note sera retirée des archives dès que le quai sera attribué.
  0565a068:
    anchor: 9c1249855783a0ca#h/la-compagnie-des-marees-grises/activites
    text: |-
      Activités

      Les navires de la Compagnie transportent le hareng fumé et le sel de Sarnoux ; la Grande Sève est la seule à porter aussi le courrier du Conseil des Quais. Maëlis Torvane a navigué sur la Grande Sève pendant six saisons, ce qui lui a permis de relever les courants décrits dans son atlas.
  0caad792:
    anchor: 9c1249855783a0ca#h/la-compagnie-des-marees-grises/relations-avec-le-conseil
    text: |-
      Relations avec le Conseil

      La Compagnie verse chaque année au Conseil des Quais une redevance de quatre cents deniers. En échange, le Conseil lui garantit l'usage exclusif du quai numéro trois du port de Port-Ysel. Oswin Dacrel a rappelé en l'an 1411 que ce privilège pouvait être révisé.
  2303b07a:
    text: |-
      Règles

      Un navire de plus de quarante tonneaux ne peut pas franchir la passe de l'Ouest pendant la Haute Eau. Tout changement de capitaine doit être déclaré au maître de port dans les huit jours. La Grande Sève est le seul navire autorisé à transporter le courrier du Conseil des Quais.
  dbe556c9:
    text: |-
      Arriving

      Ships dock at the Old Mole, the first quay of the town, built in the year 1203. During the High Water season, the Western Pass is closed to ships of more than forty tons, so large vessels must go around the island of Keld. The harbour master, Oswin Dacrel, can be found in the Hall of Ropes every morning.
  099357a0:
    text: |-
      Durée

      Tout navire suspect reste au mouillage pendant onze jours. L'équipage ne descend pas à terre. Les vivres sont livrés par le bateau-pilote Veilleuse, qui reste à distance de deux longueurs de câble.
  549584b7:
    anchor: 750a0563faf1fe1f#p1
    text: |-
      Grande régate de la Lanterne
      Le Conseil des Quais invite tous les équipages à la grande régate de la Lanterne, qui
      se tiendra le premier jour de l'an 1413 dans la rade de Port-Ysel.
      Programme
      - Départ à midi, depuis le Vieux Môle.
      - Parcours : tour de l'îlot de la Mouette, puis retour par la passe du Sud.
      - Remise des prix à la Halle des Cordages, au coucher du soleil.
      Règlement
      Les barques de moins de vingt tonneaux sont seules admises. Chaque équipage
      compte quatre marins au plus. La Brume Dorée, navire de la Compagnie des Marées
      Grises, ne concourt pas : elle servira de bateau du jury.
      Récompenses
      Le vainqueur reçoit une lanterne de cuivre et vingt deniers. Le maître de port Oswin
      Dacrel remettra les prix. Une soupe d'algues sera servie à tous les participants.
  b82495ef:
    anchor: 1140331c18193a5d#h/atlas-de-l-archipel-de-vaelmor
    text: |-
      Atlas de l'Archipel de Vaelmor

      Cet atlas fictif décrit l'Archipel de Vaelmor tel que le connaissent les navigateurs de l'an 1412 de l'Ère de la Lanterne. Il a été compilé par la cartographe Maëlis Torvane pour le compte du Conseil des Quais de Port-Ysel. Aucun lieu, aucune personne ni aucune date de ce texte n'existe dans le monde réel.
  278db3a7:
    anchor: df071d2eff588750#p3
    text: |-
      Article 6 – Durée et révision
      La convention est conclue pour dix ans à compter du premier jour de l'an 1413. Elle
      peut être révisée à la demande de l'une des parties, après un préavis de six mois.
      Toute révision exige l'accord des deux tiers du Conseil des Quais.
      Article 7 – Signatures
      Fait à Port-Ysel, dans la Halle des Cordages, le quinzième jour du mois de la Haute
      Eau. Signé : Oswin Dacrel, maître de port ; Tamsin Orrelle, directeur de la Compagnie
      des Marées Grises.
  d35a6502:
    anchor: e5dff5325d93c812#h/visitor-s-guide-to-port-ysel, e5dff5325d93c812#h/visitor-s-guide-to-port-ysel/arriving,
      e5dff5325d93c812#h/visitor-s-guide-to-port-ysel/what-to-see, e5dff5325d93c812#h/visitor-s-guide-to-port-ysel/what-to-eat,
      e5dff5325d93c812#h/visitor-s-guide-to-port-ysel/practical-advice
    text: Visitor's Guide to Port-Ysel Port-Ysel is the only large town of the fictional Archipelago of
      Vaelmor. This short guide was written for travellers arriving in the year 1412 of the Lantern Era.
      Arriving Ships dock at the Old Mole, the first quay of the town, built in the year 1203. During
      the High Water season, the Western Pass is closed to ships of more than forty tons, so large vessels
      must go around the island of Keld. The harbour master, Oswin Dacrel, can be found in the Hall of
      Ropes every morning. What to see The Lighthouse of Keld can be visited by boat on clear days. The
      keeper, Bram Oskelle, welcomes guests and offers tea. In town, do not miss the shipyard of Ormesse,
      where the coaster Misty Gold was launched this year for the Grey Tides Company. What to eat Try
      the seaweed soup of Brumeval, served with black bread and smoked silver herring. Visitors should
      avoid the salt cakes of Sarnoux, which are very strong. Practical advice The council meets on the
      first day of each month in the Hall of Ropes, and most of its sessions are open to the public. Money
      is counted in deniers. A night in an inn costs about six deniers. If a ship arrives from
  f62d86a0:
    anchor: e5dff5325d93c812#h/visitor-s-guide-to-port-ysel/practical-advice
    text: the first day of each month in the Hall of Ropes, and most of its sessions are open to the public.
      Money is counted in deniers. A night in an inn costs about six deniers. If a ship arrives from an
      island hit by the grey fever, passengers must wait eleven days at anchor before landing.
  702c8cfc:
    anchor: 0f1c6e54c5f3c5f4#h/notes-on-the-vaelmor-tide-almanac, 0f1c6e54c5f3c5f4#h/notes-on-the-vaelmor-tide-almanac/the-forty-two-day-cycle,
      0f1c6e54c5f3c5f4#h/notes-on-the-vaelmor-tide-almanac/reading-the-almanac, 0f1c6e54c5f3c5f4#h/notes-on-the-vaelmor-tide-almanac/known-errors
    text: 'Notes on the Vaelmor Tide Almanac Working notes by the cartographer Maëlis Torvane on how to
      read the tide almanac of the archipelago. The forty-two day cycle The Pale Gorge current reverses
      every forty-two days. Pilots of the Grey Tides Company use the almanac to know in advance which
      direction the current will run. A reversal in the middle of a crossing can add a full day to the
      journey between Keld and Sarnoux. Reading the almanac Each page covers one week. The left column
      gives the height of the high tide at the Old Mole in Port-Ysel, and the right column gives the direction
      of the current. A small lantern symbol marks the days when the lighthouse of Keld shows its flashing
      light. Known errors The edition of the year 1409 contains a mistake: it places the great tide of
      the autumn three days too early. Harbour master Oswin Dacrel ordered the printing house to correct
      the later editions.'
  a95cedc2:
    anchor: add51e9f5b0e469e#h/procedure-de-quarantaine-du-port-de-port-ysel, add51e9f5b0e469e#h/procedure-de-quarantaine-du-port-de-port-ysel/declenchement,
      add51e9f5b0e469e#h/procedure-de-quarantaine-du-port-de-port-ysel/duree, add51e9f5b0e469e#h/procedure-de-quarantaine-du-port-de-port-ysel/levee,
      add51e9f5b0e469e#h/procedure-de-quarantaine-du-port-de-port-ysel/confidentialite
    text: Procédure de quarantaine du port de Port-Ysel Procédure interne du Conseil des Quais, applicable
      à tout navire arrivant d'une île touchée par la fièvre grise. Déclenchement Le maître de port Oswin
      Dacrel déclare la quarantaine après avis du médecin du port, Isaure Pellan. Le feu rouge est alors
      hissé au Vieux Môle. Durée Tout navire suspect reste au mouillage pendant onze jours. L'équipage
      ne descend pas à terre. Les vivres sont livrés par le bateau-pilote Veilleuse, qui reste à distance
      de deux longueurs de câble. Levée La quarantaine est levée si aucun cas n'est déclaré pendant onze
      jours. Le Conseil des Quais en est informé par écrit. Un navire de la Compagnie des Marées Grises
      ne peut pas être exempté de cette règle. Confidentialité Les noms des malades ne figurent jamais
      dans les registres publics. Seul le médecin du port conserve la liste, qu'il détruit à la fin de
      la saison.
  8f9b6b05:
