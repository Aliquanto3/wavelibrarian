    text: 'Journal de Maëlis Torvane Extraits du journal de bord de la cartographe Maëlis Torvane, saison
      de la Haute Eau, an 1411. Premier jour Nous avons quitté Port-Ysel à l''aube à bord de la Grande
      Sève. Le capitaine Hadrien Velquor a refusé de passer par la passe de l''Ouest, trop agitée. Nous
      avons donc contourné l''île de Keld par le nord. J''ai noté que le courant de la Gorge Pâle portait
      vers le sud-est à près de trois nœuds. Quatrième jour Arrivée à Brumeval dans un brouillard si dense
      que nous avons dû suivre le son de la cloche du port. Les pêcheurs nous ont offert du hareng fumé.
      Tamsin Orrelle, qui voyageait avec nous pour inspecter les entrepôts de la Compagnie des Marées
      Grises, a trouvé les caisses mal étiquetées. Neuvième jour J''ai mesuré le renversement du courant
      : il s''est produit le quarante-deuxième jour après le dernier relevé, exactement comme prévu. Cette
      régularité permettra aux pilotes de planifier les traversées. Je transmettrai ma table au'
  948815ed:
    text: |-
      Le climat

      Le climat est océanique et humide. Les brumes de Brumeval se lèvent rarement avant midi. La saison des grandes marées, appelée la Haute Eau, dure de la mi-automne au début de l'hiver. Pendant cette période, la passe de l'Ouest est fermée aux navires de plus de quarante tonneaux.
