  6570c192:
    text: |-
      Difficultés

      Le bois de pin de la vallée de la Sève est devenu rare. Hadrien Velquor, capitaine de la Grande Sève, a proposé d'importer du chêne de Sarnoux. Oswin Dacrel a refusé tant que le traité de Brumeval ne le permettrait pas explicitement.
  c73ac704:
    text: |-
      Port-Ysel, le troisième jour de la Haute Eau, an 1412.
      Cher Hadrien,
      Je vous écris depuis le Vieux Môle, où j'attends le retour de la Grande Sève. Mon atlas
      est enfin terminé et Oswin Dacrel m'a promis de le faire imprimer avant la fin de
      l'hiver. J'ai ajouté en dernière page une table des renversements du courant de la
      Gorge Pâle, que je vous prie de vérifier lors de votre prochaine traversée.
      Vous avez raison au sujet du bois : le chêne de Sarnoux est plus dur que le pin de la
      Sève, et la coque y gagnera. Je soutiendrai votre demande devant le Conseil des
      Quais. Tamsin Orrelle m'a laissé entendre que la Compagnie des Marées Grises
      financerait la moitié de la seconde cale sèche.
      Avez-vous retrouvé mon compas de laiton ? Je l'ai perdu dans la baie de Sarnoux, par
      un matin de brume, et je n'ose plus en parler à personne. Les pêcheurs de Brumeval
      prétendent qu'il est tombé dans la fosse du grand hareng d'argent. Je préfère croire
      qu'un saunier l'a ramassé.
      Je vous remercie pour le hareng fumé, qui était excellent. Embrassez Ilsa Marenne de
      ma part, et dites-lui que la Brume Dorée est un très beau navire.
      Votre amie,
      Maëlis Torvane
