    text: 'Glossaire maritime de Vaelmor Termes employés par les marins de l''archipel. Termes de navigation
      Haute Eau : saison des grandes marées, de la mi-automne au début de l''hiver. Gorge Pâle : courant
      qui traverse l''archipel du nord-ouest vers le sud-est. Passe de l''Ouest : chenal étroit entre
      Ormesse et Keld, fermé aux grands navires pendant la Haute Eau. Longueur de câble : unité de distance
      valant environ cent quatre-vingts pas. Termes de commerce Denier : monnaie de compte du Conseil
      des Quais. Mesure : unité de volume du sel, fixée par le traité de Brumeval. Quai numéro trois :
      quai réservé à la Compagnie des Marées Grises. Termes de la vie à bord Ère de la Lanterne : calendrier
      de l''archipel, dont l''an 1 correspond à la première lanterne allumée à Port-Ysel. Fête de la Lanterne
      : premier jour de l''an, célébré par une soupe d''algues.'
