    text: Atlas de l'Archipel de Vaelmor Cet atlas fictif décrit l'Archipel de Vaelmor tel que le connaissent
      les navigateurs de l'an 1412 de l'Ère de la Lanterne. Il a été compilé par la cartographe Maëlis
      Torvane pour le compte du Conseil des Quais de Port-Ysel. Aucun lieu, aucune personne ni aucune
      date de ce texte n'existe dans le monde réel. Géographie Les îles principales L'archipel compte
      quatre îles habitées et une quarantaine d'îlots rocheux. Port-Ysel, sur l'île d'Ormesse, est la
      seule ville portuaire de plus de dix mille habitants. L'île de Keld, au nord, porte le phare du
      même nom. Brumeval, à l'est, est une île de pêcheurs entourée de brouillards presque permanents.
      Sarnoux, au sud, est réputée pour ses salines. Île | Superficie (km²) | Habitants (an 1412) | Activité
