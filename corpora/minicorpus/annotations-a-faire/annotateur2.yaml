  156fbba4:
    text: |-
      Les passes

      Deux chenaux mènent à la rade de Port-Ysel. La passe de l'Ouest, étroite et profonde, sépare Ormesse de Keld ; elle est la route la plus courte vers le nord, mais elle se ferme aux navires de plus de quarante tonneaux pendant la Haute Eau. La passe du Sud, plus large mais peu profonde, longe l'îlot de la Mouette ; seules les barques de moins de vingt tonneaux peuvent l'emprunter. Les grands navires qui ne peuvent pas franchir la passe de l'Ouest contournent l'île de Keld par le nord, ce qui allonge le voyage d'une journée environ.
  bf82c339:
    anchor: d589158ae4043017#p1
    text: 'Tarifs des passeurs de l''Archipel Tarifs en vigueur pour la saison de l''an 1412, fixés par
      la corporation des passeurs de Port-Ysel. Traversées de passagers Port-Ysel – Keld : quatre deniers.
      Port-Ysel – Brumeval : six deniers. Port-Ysel – Sarnoux : cinq deniers. Un enfant de moins de dix
      ans voyage pour la moitié du prix. Bagages et bêtes Un bagage de plus de vingt livres coûte un denier
      de plus. Un mouton de Keld paie deux deniers, un cheval huit deniers. Les paniers de sel de Sarnoux
      sont transportés au tarif de la Compagnie des Marées Grises. Haute Eau Pendant la Haute Eau, les
      tarifs sont majorés d''un tiers. Les passeurs ne sortent pas lorsque le feu à éclats du phare de
      Keld est allumé.'
