      1140331c18193a5d#h/atlas-de-l-archipel-de-vaelmor/voir-aussi
    text: '1 correspond à la première lanterne allumée à Port-Ysel. L''année commence par la fête de la
      Lanterne, où l''on sert une soupe d''algues. Les mois n''ont pas de nom : on dit le mois de la Haute
      Eau pour le premier mois de la saison des grandes marées, et l''on désigne les autres par leur rang.
      La santé Le médecin du port veille sur la santé des équipages. La fièvre grise, qui touche parfois
      les îles extérieures, oblige les navires suspects à rester onze jours au mouillage avant de débarquer.
      Le bateau-pilote Veilleuse leur livre les vivres à distance. Voir aussi Le registre des navires,
      le journal de Maëlis Torvane et l''histoire de la Compagnie des Marées Grises complètent cet atlas.'
