    anchor: c24a7ced54152a42#h/rapport-du-chantier-naval-de-port-ysel, c24a7ced54152a42#h/rapport-du-chantier-naval-de-port-ysel/navires-construits,
      c24a7ced54152a42#h/rapport-du-chantier-naval-de-port-ysel/reparations, c24a7ced54152a42#h/rapport-du-chantier-naval-de-port-ysel/difficultes,
      c24a7ced54152a42#h/rapport-du-chantier-naval-de-port-ysel/perspectives
    text: 'Rapport du chantier naval de Port-Ysel Rapport annuel de l''an 1412 adressé au Conseil des
      Quais par le chantier naval d''Ormesse. Navires construits Le chantier a lancé deux navires cette
      année : la Brume Dorée, un caboteur de trente tonneaux commandé par la Compagnie des Marées Grises,
      et le Petit Sarnoux, une barque à fond plat destinée aux sauniers. La construction de la Brume Dorée
      a duré neuf mois et occupé vingt-deux charpentiers. Réparations Quatre navires ont été carénés,
      dont la Grande Sève. Maëlis Torvane a demandé que sa coque soit renforcée avant la prochaine saison
      de relevés. Le coût total des réparations s''élève à mille huit cents deniers. Difficultés Le bois
      de pin de la vallée de la Sève est devenu rare. Hadrien Velquor, capitaine de la Grande Sève, a
      proposé d''importer du chêne de Sarnoux. Oswin Dacrel a refusé tant que le traité de Brumeval ne
      le permettrait pas explicitement. Perspectives Le chantier demande au Conseil des Quais la création
      d''une seconde'
