  6cb4b758:
    anchor: 0d5e0a0ad541270b#h/les-legendes-des-brumes, 0d5e0a0ad541270b#h/les-legendes-des-brumes/la-dame-de-la-cloche,
      0d5e0a0ad541270b#h/les-legendes-des-brumes/le-hareng-d-argent, 0d5e0a0ad541270b#h/les-legendes-des-brumes/les-lanternes-de-sarnoux
    text: Les légendes des brumes Recueil de trois légendes de Brumeval, racontées par les anciens et
      notées au fil des saisons. La dame de la cloche On raconte qu'une femme, Elwenn Marsac, sonne la
      cloche du port les nuits de brouillard pour guider les barques perdues. Les pêcheurs affirment qu'elle
      ne vieillit pas et que sa cloche ne sonne jamais deux fois de la même manière. Le hareng d'argent
      Un hareng plus grand qu'une barque vivrait dans la fosse située au large de Brumeval. Quiconque
      le voit doit rejeter à l'eau sa première prise de la saison. Les marins de la Compagnie des Marées
      Grises ne croient pas à cette histoire, mais ils respectent l'usage. Les lanternes de Sarnoux Certains
      soirs, de petites lumières dansent sur les marais salants de Sarnoux. Les sauniers disent qu'il
      s'agit des âmes des marins morts pendant les guerres du sel. Maëlis Torvane a consigné cette légende
      dans ses carnets sans y ajouter de commentaire.
  aa16ea35:
    anchor: 1140331c18193a5d#h/atlas-de-l-archipel-de-vaelmor/societe/les-corporations, 1140331c18193a5d#h/atlas-de-l-archipel-de-vaelmor/societe/la-monnaie-et-les-mesures,
      1140331c18193a5d#h/atlas-de-l-archipel-de-vaelmor/societe/le-calendrier
    text: 'corporations La vie de Port-Ysel s''organise autour de sept corporations : les pêcheurs, les
      passeurs, les charpentiers de marine, les sauniers, les marchands, les pilotes et les gens de phare.
      Chacune élit un représentant au Conseil des Quais. Les corporations fixent leurs propres tarifs
      ; celle des passeurs publie chaque saison la liste des prix des traversées de passagers. La monnaie
      et les mesures Le denier est la monnaie de compte du Conseil des Quais. Une nuit dans une auberge
      de Port-Ysel coûte environ six deniers, une caisse de hareng fumé se vend une trentaine de deniers
      au marché du Vieux Môle. Le sel se compte en mesures, unité de volume fixée par le traité de Brumeval.
      Les poids se comptent en livres et les cargaisons en tonneaux. Le calendrier L''archipel compte
      les années selon l''Ère de la Lanterne, dont l''an 1 correspond à la première lanterne allumée à
      Port-Ysel. L''année commence par la fête de la Lanterne, où l''on sert une soupe d''algues. Les
      mois n''ont pas de'
